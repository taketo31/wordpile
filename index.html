const norm = (s) =>
  (s || "")
    .toLowerCase()
    .replace(/[^a-z\s']/g, " ")
    .replace(/\s+/g, " ")
    .trim();

function lev(a, b) {
  const m = a.length,
    n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(
        prev[j] + 1,
        cur[j - 1] + 1,
        prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
    }
    prev = cur;
  }
  return prev[n];
}

function scoreSpeech(target, heard) {
  const t = norm(target),
    h = norm(heard);
  if (!t || !h) return 0;
  if (h.includes(t)) return 1;
  const best = Math.max(
    1 - lev(t, h) / Math.max(t.length, h.length),
    ...h.split(" ").map((w) => 1 - lev(t, w) / Math.max(t.length, w.length))
  );
  return Math.max(0, best);
}

function parseText(text) {
  const paras = text.split(/\n+/).filter((p) => p.trim().length);
  return paras.map((p, pi) => {
    const sentences = p.match(/[^.!?]+[.!?]*["')\]]*\s*/g) || [p];
    return sentences.map((s, si) => ({
      key: `p${pi}s${si}`,
      raw: s.trim(),
      tokens: s.split(/(\s+)/).filter((t) => t !== ""),
    }));
  });
}
const core = (tok) =>
  tok.replace(/^[^A-Za-z'’-]+/, "").replace(/[^A-Za-z'’-]+$/, "");
const isWord = (c) => c.length > 1 && /[A-Za-z]{2,}/.test(c);
const isSpace = (t) => /^\s+$/.test(t);

/* group contiguous selected tokens into phrases */
function buildGroups(parsed, sel, splits) {
  const groups = [];
  parsed.forEach((para) =>
    para.forEach((sen) => {
      const picked = sen.tokens
        .map((t, i) => ({ t, i }))
        .filter(({ t, i }) => sel[`${sen.key}:${i}`] && isWord(core(t)));
      if (!picked.length) return;
      let run = [];
      const flush = () => {
        if (!run.length) return;
        const key = `${sen.key}:${run[0].i}-${run[run.length - 1].i}`;
        if (run.length > 1 && splits[key]) {
          run.forEach((r) =>
            groups.push({
              key: `${sen.key}:${r.i}-${r.i}`,
              text: core(r.t),
              context: sen.raw,
              senKey: sen.key,
              idxs: [r.i],
              parentKey: key,
            })
          );
        } else {
          groups.push({
            key,
            text: run.map((r) => core(r.t)).join(" "),
            context: sen.raw,
            senKey: sen.key,
            idxs: run.map((r) => r.i),
          });
        }
        run = [];
      };
      picked.forEach((p, k) => {
        if (!run.length) return void (run = [p]);
        const prev = run[run.length - 1];
        const between = sen.tokens.slice(prev.i + 1, p.i);
        const joinable = between.length > 0 && between.every(isSpace);
        if (joinable) run.push(p);
        else {
          flush();
          run = [p];
        }
      });
      flush();
    })
  );
  return groups;
}

function shuffle(arr, seed) {
  const a = [...arr];
  let s = seed;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 1103515245 + 12345) % 2147483648;
    const j = s % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* pronunciation check ------------------------------------------------ */
function SayIt({ target, onResult, compact = false }) {
  const [state, setState] = useState("idle"); // idle | listening | done | blocked
  const [heard, setHeard] = useState("");
  const [score, setScore] = useState(0);
  const recRef = useRef(null);

  useEffect(() => {
    setState("idle");
    setHeard("");
    setScore(0);
  }, [target]);

  useEffect(() => () => recRef.current?.abort?.(), []);

  const start = () => {
    if (!SR) return setState("blocked");
    try {
      const rec = new SR();
      recRef.current = rec;
      rec.lang = "en-US";
      rec.interimResults = false;
      rec.maxAlternatives = 3;
      rec.onresult = (e) => {
        const alts = Array.from(e.results[0]).map((r) => r.transcript);
        const best = alts.reduce(
          (acc, t) => {
            const s = scoreSpeech(target, t);
            return s > acc.s ? { s, t } : acc;
          },
          { s: 0, t: alts[0] || "" }
        );
        setHeard(best.t);
        setScore(best.s);
        setState("done");
        onResult?.(best.s >= 0.8);
      };
      rec.onerror = () => setState("blocked");
      rec.onend = () => setState((s) => (s === "listening" ? "idle" : s));
      rec.start();
      setState("listening");
    } catch {
      setState("blocked");
    }
  };

  const verdict =
    score >= 0.9
      ? { t: "Clear", c: T.good }
      : score >= 0.7
      ? { t: "Close — try once more", c: T.warm }
      : { t: "Not quite", c: T.bad };

  return (
    <div className={compact ? "" : "px-6 py-4"} style={compact ? {} : { borderTop: `1px solid ${T.line}` }}>
      <div className="flex flex-wrap items-center gap-3">
        <button
          onClick={start}
          disabled={state === "listening"}
          className="px-4 py-2 rounded-full flex items-center gap-2"
          style={{
            border: `1px solid ${state === "listening" ? T.ink : T.line}`,
            background: state === "listening" ? T.marker : "transparent",
            color: T.ink,
            fontFamily: MONO,
            fontSize: 11,
            letterSpacing: "0.06em",
          }}
        >
          <span>●</span>
          {state === "listening" ? "listening…" : "say it"}
        </button>
        {state === "done" && (
          <>
            <span style={{ fontFamily: MONO, fontSize: 12, color: verdict.c }}>{verdict.t}</span>
            <span style={{ fontSize: 13, color: T.ink3 }}>
              heard “{heard}” · {Math.round(score * 100)}%
            </span>
          </>
        )}
        {state === "blocked" && (
          <span style={{ fontSize: 12, color: T.ink3 }}>
            {SR ? "Mic unavailable here — playback still works." : "This browser has no speech input. Chrome supports it."}
          </span>
        )}
      </div>
    </div>
  );
}

              saidRight: 0,
              saidWrong: 0,

            }))
          );
        } catch {}

  }, []);

  useEffect(() => {
    if (loaded) store.set(KEY, JSON.stringify(words));
  }, [words, loaded]);
  useEffect(() => {
    if (loaded) store.set(KEY_SETTINGS, JSON.stringify({ lang, autoSay }));
  }, [lang, autoSay, loaded]);

  const learning = useMemo(() => words.filter((w) => w.streak < NEEDED), [words]);
  const mastered = useMemo(() => words.filter((w) => w.streak >= NEEDED), [words]);

  const [busy, setBusy] = useState(null);
  const [justAdded, setJustAdded] = useState([]);

  const addWords = useCallback(
    async (items) => {
      const have = new Set(words.map((w) => w.word.toLowerCase()));
      const fresh = items.filter((it) => it.word && !have.has(it.word.toLowerCase()));
      if (!fresh.length) return;
      setBusy({ done: 0, total: fresh.length });
      const made = [];
      for (let i = 0; i < fresh.length; i += 4) {
        const chunk = fresh.slice(i, i + 4);
        let out = [];
        try {
          out = await lookupChunk(chunk, lang);
        } catch {
          out = [];
        }
        chunk.forEach((it) => {
          const hit =
            out.find((o) => norm(o.word) === norm(it.word)) ||
            out[chunk.indexOf(it)] ||
            {};
          made.push({
            id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
            word: it.word,
            kind: it.word.trim().includes(" ") ? "phrase" : "word",
            pos: hit.pos || "",
            definition: hit.definition || "",
                        fullDefinition: Array.isArray(hit.fullDefinition) ? hit.fullDefinition : [],
            example: hit.example || "",
            distractors: Array.isArray(hit.distractors) ? hit.distractors.slice(0, 3) : [],
            context: it.context || "",
            streak: 0,
            right: 0,
            wrong: 0,
            saidRight: 0,
            saidWrong: 0,
            added: Date.now(),
          });
        });
        setBusy({ done: Math.min(i + 4, fresh.length), total: fresh.length });
      }
      setWords((w) => [...made, ...w]);
      setJustAdded(made);
      setBusy(null);
    },
    [words, lang]
  );

  const retryLookup = useCallback(async () => {
    const targets = words.filter((w) => !w.definition);
    if (!targets.length) return;
    setBusy({ done: 0, total: targets.length });
    for (let i = 0; i < targets.length; i += 4) {
      const chunk = targets.slice(i, i + 4);
      let out = [];
      try {
        out = await lookupChunk(
          chunk.map((c) => ({ word: c.word, context: c.context })),
          lang
        );
      } catch {
        out = [];
      }
      const ids = new Set(chunk.map((c) => c.id));
      setWords((ws) =>
        ws.map((w) => {
          if (!ids.has(w.id)) return w;
          const hit = out.find((o) => norm(o.word) === norm(w.word));
          if (!hit) return w;
          return {
            ...w,
            pos: hit.pos || w.pos,
definition: hit.definition || w.definition,
                        fullDefinition: Array.isArray(hit.fullDefinition) ? hit.fullDefinition : w.fullDefinition,
            example: hit.example || w.example,
            distractors: Array.isArray(hit.distractors)
              ? hit.distractors.slice(0, 3)
              : w.distractors,
          };
        })
      );
      setBusy({ done: Math.min(i + 4, targets.length), total: targets.length });
    }
    setBusy(null);
  }, [words, lang]);

  const update = (id, patch) =>
    setWords((w) => w.map((x) => (x.id === id ? { ...x, ...patch } : x)));
  const remove = (id) => setWords((w) => w.filter((x) => x.id !== id));

  return (
    <div style={{ background: T.paper, color: T.ink, fontFamily: SANS, minHeight: "100%" }} className="w-full">
      <style>{`
        @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
        .vd-tok{cursor:pointer;transition:background .12s ease}
        .vd-tok:hover{background:rgba(21,24,28,0.07)}
        .vd-opt{transition:border-color .12s ease, background .12s ease, transform .08s ease}
        .vd-opt:active{transform:scale(0.995)}
        .vd-in{outline:none;border:1px solid ${T.line};background:${T.card};border-radius:6px}
        .vd-in:focus{border-color:${T.ink};box-shadow:0 0 0 2px rgba(21,24,28,0.08)}
        button:focus-visible{outline:2px solid ${T.ink};outline-offset:2px}
        @keyframes vdpulse{0%,100%{opacity:1}50%{opacity:.35}}
      `}</style>

      <div className="max-w-3xl mx-auto px-5 py-7">
        <div className="flex flex-wrap items-end justify-between gap-4 mb-6">
          <div>
            <div style={{ fontFamily: MONO, fontSize: 22, letterSpacing: "-0.02em", fontWeight: 600 }}>
              wordpile
            </div>
            <Label style={{ marginTop: 4 }}>read · mark · say · drill until three</Label>
          </div>
          <div style={{ fontFamily: MONO, fontSize: 13 }}>
            {learning.length}
            <span style={{ color: T.ink3 }}> learning</span>
            <span style={{ color: T.line }}> / </span>
            {mastered.length}
            <span style={{ color: T.ink3 }}> known</span>
          </div>
        </div>

        <div className="mb-6">
          <Seg
            value={view}
            onChange={setView}
            items={[
              { id: "read", label: "Read" },
              { id: "drill", label: "Drill", count: learning.length || null },
              { id: "deck", label: "Deck", count: words.length || null },
            ]}
          />
        </div>

        {busy && (
          <div className="mb-5 px-4 py-3 rounded-lg flex items-center gap-3" style={{ background: T.card, border: `1px solid ${T.line}` }}>
            <span
              style={{
                width: 8,
                height: 8,
                borderRadius: 99,
                background: T.marker,
                boxShadow: `0 0 0 4px ${T.markerSoft}`,
                animation: "vdpulse 1.1s ease-in-out infinite",
              }}
            />
            <span style={{ fontFamily: MONO, fontSize: 12 }}>
              Looking up meanings — {busy.done} of {busy.total}
            </span>
          </div>
        )}

        {view === "read" && (
          <ReadView
            words={words}
            onAdd={addWords}
            busy={!!busy}
            justAdded={justAdded}
            clearJustAdded={() => setJustAdded([])}
            goDrill={() => setView("drill")}
          />
        )}
        {view === "drill" && (
          <DrillView
            words={words}
            update={update}
            autoSay={autoSay}
            setAutoSay={setAutoSay}
            retryLookup={retryLookup}
            busy={!!busy}
            goDeck={() => setView("deck")}
            goRead={() => setView("read")}
          />
        )}
        {view === "deck" && (
          <DeckView
            words={words}
            retryLookup={retryLookup}
            busy={!!busy}
            learning={learning}
            mastered={mastered}
            update={update}
            remove={remove}
            setWords={setWords}
            addWords={addWords}
            lang={lang}
            setLang={setLang}
          />
        )}
      </div>
    </div>
  );
}

function ReadView({ words, onAdd, busy, justAdded, clearJustAdded, goDrill }) {
  const [text, setText] = useState("");
  const [reading, setReading] = useState(false);
  const [sel, setSel] = useState({});
  const [splits, setSplits] = useState({});
  const [peek, setPeek] = useState(null);

  const deckMap = useMemo(() => {
    const m = new Map();
    words.forEach((w) => m.set(w.word.toLowerCase(), w));
    return m;
  }, [words]);

  const parsed = useMemo(() => (reading ? parseText(text) : []), [reading, text]);
  const groups = useMemo(() => buildGroups(parsed, sel, splits), [parsed, sel, splits]);

  /* map token -> position within its group, for the marker sweep */
  const hl = useMemo(() => {
    const m = {};
    groups.forEach((g) => {
      const [start, end] = [g.idxs[0], g.idxs[g.idxs.length - 1]];
      for (let i = start; i <= end; i++) {
        m[`${g.senKey}:${i}`] =
          start === end ? "solo" : i === start ? "start" : i === end ? "end" : "mid";
      }
    });
    return m;
  }, [groups]);

  const toggle = (senKey, i) => {
    const k = `${senKey}:${i}`;
    setSel((s) => {
      const n = { ...s };
      if (n[k]) delete n[k];
      else n[k] = true;
      return n;
    });
  };

  const dropGroup = (g) =>
    setSel((s) => {
      const n = { ...s };
      g.idxs.forEach((i) => delete n[`${g.senKey}:${i}`]);
      return n;
    });

  if (!reading) {
    return (
      <div>
        <Label style={{ marginBottom: 8 }}>Source text</Label>
        <textarea
          value={text}
          onChange={(e) => setText(e.target.value)}
          placeholder="Paste an article, a transcript, a report — anything you're reading. Then tap the words and phrases you don't own yet."
          className="vd-in w-full p-4"
          style={{ minHeight: 220, fontFamily: SANS, fontSize: 15, lineHeight: 1.65, color: T.ink, resize: "vertical" }}
        />
        <div className="flex items-center gap-3 mt-4">
          <button
            onClick={() => text.trim() && setReading(true)}
            className="px-5 py-2.5 rounded-full"
            style={{
              background: text.trim() ? T.ink : T.line,
              color: text.trim() ? T.card : T.ink3,
              fontFamily: MONO,
              fontSize: 12,
              letterSpacing: "0.08em",
            }}
          >
            Start marking
          </button>
          <span style={{ fontSize: 13, color: T.ink3 }}>
            {text.trim() ? `${text.trim().split(/\s+/).length} words` : ""}
          </span>
        </div>

        {justAdded.length > 0 && <AddedPanel items={justAdded} onClose={clearJustAdded} goDrill={goDrill} />}
      </div>
    );
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-3 gap-3">
        <Label>Tap a word · tap its neighbour to build a phrase</Label>
        <button
          onClick={() => {
            setReading(false);
            setSel({});
            setSplits({});
          }}
          style={{ fontFamily: MONO, fontSize: 11, color: T.ink2 }}
        >
          ← new text
        </button>
      </div>

      <div
        className="p-5 rounded-lg"
        style={{
          background: T.card,
          border: `1px solid ${T.line}`,
          fontSize: 16,
          lineHeight: 2.0,
          maxHeight: "52vh",
          overflowY: "auto",
        }}
      >
        {parsed.map((para, pi) => (
          <p key={pi} className={pi ? "mt-4" : ""}>
            {para.map((sen) =>
              sen.tokens.map((tok, ti) => {
                const pos = hl[`${sen.key}:${ti}`];
                if (isSpace(tok))
                  return (
                    <span
                      key={`${sen.key}-${ti}`}
                      style={{
                        background: pos && pos !== "solo" ? T.marker : "transparent",
                      }}
                    >
                      {tok}
                    </span>
                  );
                const c = core(tok);
                if (!isWord(c)) return <span key={`${sen.key}-${ti}`}>{tok}</span>;
                const inDeck = deckMap.get(c.toLowerCase());
                const pre = tok.slice(0, tok.indexOf(c));
                const post = tok.slice(tok.indexOf(c) + c.length);
                const radius =
                  pos === "solo"
                    ? "3px"
                    : pos === "start"
                    ? "3px 0 0 3px"
                    : pos === "end"
                    ? "0 3px 3px 0"
                    : "0";
                return (
                  <span key={`${sen.key}-${ti}`}>
                    {pre}
                    <span
                      className="vd-tok"
                      onClick={() =>
                        inDeck && !pos ? setPeek(inDeck) : toggle(sen.key, ti)
                      }
                      style={{
                        padding: "2px 1px",
                        background: pos ? T.marker : "transparent",
                        borderRadius: radius,
                        borderBottom: inDeck && !pos ? `2px solid ${T.markerSoft}` : "none",
                        color: inDeck && !pos ? T.ink3 : T.ink,
                      }}
                      title={inDeck ? "In your deck — tap to see the meaning" : ""}
                    >
                      {c}
                    </span>
                    {post}
                  </span>
                );
              })
            )}
          </p>
        ))}
      </div>

      {/* tray */}
      <div className="mt-4 sticky bottom-0 pb-3" style={{ background: T.paper }}>
        {groups.length > 0 && (
          <div className="flex flex-wrap gap-2 mb-3">
            {groups.map((g) => {
              const multi = g.idxs.length > 1;
              return (
                <span
                  key={g.key}
                  className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full"
                  style={{
                    background: T.card,
                    border: `1px solid ${multi ? T.ink : T.line}`,
                    fontFamily: MONO,
                    fontSize: 12,
                  }}
                >
                  {multi && <span style={{ color: T.ink3, fontSize: 10 }}>phrase</span>}
                  {g.text}
                  {multi && (
                    <button
                      onClick={() => setSplits((s) => ({ ...s, [g.key]: true }))}
                      title="Keep as separate words"
                      style={{ color: T.ink3 }}
                    >
                      ⤨
                    </button>
                  )}
                  {!multi && g.parentKey && (
                    <button
                      onClick={() =>
                        setSplits((s) => {
                          const n = { ...s };
                          delete n[g.parentKey];
                          return n;
                        })
                      }
                      title="Join back into a phrase"
                      style={{ color: T.ink3 }}
                    >
                      ⤝
                    </button>
                  )}
                  <button onClick={() => dropGroup(g)} style={{ color: T.ink3 }} title="Remove">
                    ×
                  </button>
                </span>
              );
            })}
          </div>
        )}
        <div className="flex flex-wrap items-center gap-3">
          <button
            disabled={!groups.length || busy}
            onClick={async () => {
              const items = groups.map((g) => ({ word: g.text, context: g.context }));
              setSel({});
              setSplits({});
              await onAdd(items);
            }}
            className="px-5 py-2.5 rounded-full"
            style={{
              background: groups.length && !busy ? T.ink : T.line,
              color: groups.length && !busy ? T.card : T.ink3,
              fontFamily: MONO,
              fontSize: 12,
              letterSpacing: "0.08em",
            }}
          >
            Add {groups.length || ""} to deck
          </button>
          {groups.length > 0 && (
            <button onClick={() => setSel({})} style={{ fontFamily: MONO, fontSize: 11, color: T.ink2 }}>
              clear marks
            </button>
          )}
        </div>
      </div>

      {justAdded.length > 0 && <AddedPanel items={justAdded} onClose={clearJustAdded} goDrill={goDrill} />}

      {peek && (
        <div
          className="fixed left-0 right-0 bottom-0 p-4 z-20"
          style={{ background: "rgba(21,24,28,0.18)" }}
          onClick={() => setPeek(null)}
        >
          <div
            className="max-w-lg mx-auto p-5 rounded-lg"
            style={{ background: T.card, border: `1px solid ${T.line}` }}
            onClick={(e) => e.stopPropagation()}
          >
            <div className="flex items-center gap-3 mb-1">
              <span style={{ fontFamily: MONO, fontSize: 20 }}>{peek.word}</span>
              <Speaker text={peek.word} />
              <Speaker text={peek.word} slow />
              <span className="ml-auto">
                <Tally n={peek.streak} />
              </span>
            </div>
            {peek.pos && <div style={{ fontSize: 12, color: T.ink3, fontStyle: "italic" }}>{peek.pos}</div>}
<div style={{ fontSize: 15, marginTop: 8 }}>{peek.definition ? <FullDef item={peek} fallback="No meaning saved yet" /> : "No meaning saved yet"}</div>
            {peek.example && (
              <div style={{ fontSize: 13, color: T.ink2, marginTop: 8, lineHeight: 1.6 }}>“{peek.example}”</div>
            )}
            <button
              onClick={() => setPeek(null)}
              className="mt-4 px-4 py-2 rounded-full"
              style={{ background: T.ink, color: T.card, fontFamily: MONO, fontSize: 11 }}
            >
              close
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function AddedPanel({ items, onClose, goDrill }) {

      <div className="px-4 py-3 flex items-center justify-between" style={{ borderBottom: `1px solid ${T.line}` }}>
        <Label>Added — {items.length}</Label>
        <div className="flex gap-4">
          <button onClick={goDrill} style={{ fontFamily: MONO, fontSize: 11, color: T.ink2 }}>

        </div>
      </div>
      <div>
        {items.map((w) => (
          <div key={w.id} className="px-4 py-3" style={{ borderTop: `1px solid ${T.line}` }}>

              <span style={{ fontFamily: MONO, fontSize: 15 }}>{w.word}</span>
              <Speaker text={w.word} />
              <Speaker text={w.word} slow />
              {w.kind === "phrase" && (
                <span style={{ fontFamily: MONO, fontSize: 9, color: T.ink3, letterSpacing: "0.1em" }}>PHRASE</span>
              )}
              {w.pos && <span style={{ fontSize: 12, color: T.ink3, fontStyle: "italic" }}>{w.pos}</span>}
            </div>
            <div style={{ fontSize: 14, color: w.definition ? T.ink2 : T.bad, marginTop: 3 }}>
                {w.definition ? <FullDef item={w} fallback="Lookup failed — add the meaning in Deck" /> : "Lookup failed — add the meaning in Deck"}
            </div>
            {w.example && (
              <div style={{ fontSize: 13, color: T.ink3, marginTop: 4, lineHeight: 1.6 }}>“{w.example}”</div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  DRILL                                                              */
/* ------------------------------------------------------------------ */
function DrillView({ words, update, autoSay, setAutoSay, retryLookup, busy, goDeck, goRead }) {
  const pool = useMemo(() => words.filter((w) => w.streak < NEEDED && w.definition), [words]);
  const [curId, setCurId] = useState(null);
  const [seed, setSeed] = useState(() => Math.floor(Math.random() * 1e9));
  const [chosen, setChosen] = useState(null);
  const [showCtx, setShowCtx] = useState(false);
  const [audioFirst, setAudioFirst] = useState(false);
  const [session, setSession] = useState({ right: 0, wrong: 0 });

  const pickNext = useCallback(
    (avoid) => {
      if (!pool.length) return setCurId(null);
      const cands = pool.length > 1 ? pool.filter((w) => w.id !== avoid) : pool;
      const weighted = [];
      cands.forEach((w) => {
        const n = NEEDED - w.streak + Math.min(2, w.wrong);
        for (let i = 0; i < n; i++) weighted.push(w.id);
      });
      setCurId(weighted[Math.floor(Math.random() * weighted.length)]);
      setSeed(Math.floor(Math.random() * 1e9));
      setChosen(null);
      setShowCtx(false);
    },
    [pool]
  );

  useEffect(() => {
    if (!curId || !pool.find((w) => w.id === curId)) pickNext(curId);
  }, [pool, curId, pickNext]);

  const cur = words.find((w) => w.id === curId);

  useEffect(() => {
    if (cur && (autoSay || audioFirst)) say(cur.word);
  }, [curId]); // eslint-disable-line

const options = useMemo(() => {
      if (!cur) return [];
      let wrongs = (cur.distractors || []).filter(Boolean).slice(0, 3);
      if (wrongs.length < 3) {
              const isPhrase = (cur.word || "").trim().includes(" ");
              const generated = pickDistractors(cur.pos || "", isPhrase, cur.definition || "");
              for (const g of generated) {
                        if (wrongs.length >= 3) break;
                        if (!wrongs.includes(g) && g !== cur.definition) wrongs.push(g);
              }
      }
      return shuffle([{ t: cur.definition, ok: true }, ...wrongs.map((t) => ({ t, ok: false }))], seed);
}, [cur, seed]);

  const answer = (opt) => {
    if (chosen || !cur) return;
    setChosen(opt);
    if (opt.ok) {
      update(cur.id, { streak: cur.streak + 1, right: cur.right + 1 });
      setShowCtx(true);
      setSession((x) => ({ ...x, right: x.right + 1 }));
    } else {
      update(cur.id, { streak: 0, wrong: cur.wrong + 1 });
      setSession((x) => ({ ...x, wrong: x.wrong + 1 }));
    }
  };

  useEffect(() => {
    const h = (e) => {
      if (!cur) return;
      if (!chosen && ["1", "2", "3", "4"].includes(e.key)) {
        const o = options[Number(e.key) - 1];
        if (o) answer(o);
      } else if (chosen && (e.key === "Enter" || e.key === " ")) {
        e.preventDefault();
        pickNext(cur.id);
      } else if (e.key.toLowerCase() === "p") {
        say(cur.word);
      }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  });

  const stuck = words.filter((w) => w.streak < NEEDED && !w.definition);

  if (!pool.length) {
    const noMeaning = stuck.length > 0;
    return (
      <div className="p-8 rounded-lg text-center" style={{ background: T.card, border: `1px solid ${T.line}` }}>
        <div style={{ fontFamily: MONO, fontSize: 14, marginBottom: 8 }}>
          {noMeaning ? `${stuck.length} card${stuck.length > 1 ? "s" : ""} without a meaning` : "Nothing in rotation"}
        </div>
        <p style={{ color: T.ink2, fontSize: 14, marginBottom: 16, lineHeight: 1.6 }}>
          {noMeaning
            ? "A card needs a meaning before it can be drilled. The lookup didn't come back — try again, or type the meanings yourself in Deck."
            : words.length
            ? "Every item has three tallies. Mark some new ones to keep going."
            : "Go to Read, paste something you're reading, tap the words and phrases you want, then hit Add to deck."}
        </p>
        <div className="flex flex-wrap gap-3 justify-center">
          {noMeaning && (
            <button
              onClick={retryLookup}
              disabled={busy}
              className="px-5 py-2.5 rounded-full"
              style={{ background: busy ? T.line : T.ink, color: busy ? T.ink3 : T.card, fontFamily: MONO, fontSize: 12 }}
            >
              {busy ? "fetching…" : "Fetch meanings"}
            </button>
          )}
          <button
            onClick={noMeaning ? goDeck : goRead}
            className="px-5 py-2.5 rounded-full"
            style={{
              background: noMeaning ? "transparent" : T.ink,
              border: noMeaning ? `1px solid ${T.line}` : "none",
              color: noMeaning ? T.ink : T.card,
              fontFamily: MONO,
              fontSize: 12,
            }}
          >
            {noMeaning ? "Open deck" : "Go to Read"}
          </button>
        </div>
      </div>
    );
  }
  if (!cur) return null;

  const hidden = audioFirst && !chosen;
  const wasRight = chosen?.ok;

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <Label>{pool.length} in rotation</Label>
        <div className="flex items-center gap-4">
          {canSpeak && (
            <>
              <button
                onClick={() => setAudioFirst((v) => !v)}
                style={{ fontFamily: MONO, fontSize: 11, color: audioFirst ? T.ink : T.ink3 }}
              >
                {audioFirst ? "▣" : "▢"} audio first
              </button>
              <button
                onClick={() => setAutoSay((v) => !v)}
                style={{ fontFamily: MONO, fontSize: 11, color: autoSay ? T.ink : T.ink3 }}
              >
                {autoSay ? "▣" : "▢"} auto play
              </button>
            </>
          )}
          <span style={{ fontFamily: MONO, fontSize: 11, color: T.ink3 }}>
            {session.right}✓ {session.wrong}✗
          </span>
        </div>
      </div>

      <div className="rounded-lg overflow-hidden" style={{ background: T.card, border: `1px solid ${T.line}` }}>
        <div className="px-6 pt-7 pb-5 flex items-start justify-between gap-4">
          <div className="min-w-0">
            <div className="flex items-center gap-3 flex-wrap">
              <span
                style={{
                  fontFamily: MONO,
                  fontSize: cur.word.length > 16 ? 24 : 32,
                  letterSpacing: "-0.02em",
                  lineHeight: 1.15,
                  color: hidden ? "transparent" : T.ink,
                  background: hidden ? T.line : "transparent",
                  borderRadius: 4,
                }}
              >
                {hidden ? "•".repeat(Math.min(12, cur.word.length)) : cur.word}
              </span>
              <Speaker text={cur.word} size={17} />
              <Speaker text={cur.word} size={17} slow />
            </div>
            <div className="flex items-center gap-3 mt-2">
              {cur.kind === "phrase" && (
                <span style={{ fontFamily: MONO, fontSize: 9, color: T.ink3, letterSpacing: "0.1em" }}>PHRASE</span>
              )}
              {cur.pos && <span style={{ fontSize: 13, color: T.ink3, fontStyle: "italic" }}>{cur.pos}</span>}
            </div>
          </div>
          <div className="flex flex-col items-end gap-2 shrink-0">
            <Tally n={cur.streak} />
            <span style={{ fontFamily: MONO, fontSize: 10, color: T.ink3 }}>{cur.streak}/3</span>
          </div>
        </div>

        <div className="px-6 pb-6 space-y-2">
          {options.map((o, i) => {
            let border = T.line,
              bg = "transparent",
              fg = T.ink;
            if (chosen) {
              if (o.ok) {
                border = T.good;
                bg = T.goodSoft;
                fg = T.good;
              } else if (o === chosen) {
                border = T.bad;
                bg = T.badSoft;
                fg = T.bad;
              } else fg = T.ink3;
            }
            return (
              <button
                key={i}
                onClick={() => answer(o)}
                disabled={!!chosen}
                className="vd-opt w-full text-left px-4 py-3 rounded-lg flex gap-3 items-start"
                style={{
                  border: `1px solid ${border}`,
                  background: bg,
                  color: fg,
                  fontSize: 15,
                  lineHeight: 1.5,
                  cursor: chosen ? "default" : "pointer",
                }}
              >
                <span style={{ fontFamily: MONO, fontSize: 11, color: T.ink3, marginTop: 3 }}>{i + 1}</span>
                <span>{o.t}</span>
              </button>
            );
          })}
        </div>

        {chosen && (
          <>
            <div
              className="px-6 py-4 flex flex-wrap items-center justify-between gap-3"
              style={{ borderTop: `1px solid ${T.line}`, background: wasRight ? T.goodSoft : T.badSoft }}
            >
              <span style={{ fontFamily: MONO, fontSize: 12, color: wasRight ? T.good : T.bad }}>
                {wasRight
                  ? cur.streak >= NEEDED
                    ? "Three tallies — moved to Known"
                    : `Correct — ${cur.streak}/3`
                  : "Missed — tallies back to 0"}
              </span>
              <div className="flex items-center gap-4">
                {(cur.context || cur.example) && (
                  <button onClick={() => setShowCtx((s) => !s)} style={{ fontFamily: MONO, fontSize: 11, color: T.ink2 }}>
                    {showCtx ? "hide context" : "see it in use"}
                  </button>
                )}
                <button
                  onClick={() => pickNext(cur.id)}
                  className="px-5 py-2 rounded-full"
                  style={{ background: T.ink, color: T.card, fontFamily: MONO, fontSize: 12 }}
                >
                  Next ⏎
                </button>
              </div>
            </div>

            <SayIt
              target={cur.word}
              onResult={(ok) =>
                update(cur.id, ok ? { saidRight: (cur.saidRight || 0) + 1 } : { saidWrong: (cur.saidWrong || 0) + 1 })
              }
            />

            {showCtx && (
              <div className="px-6 py-4" style={{ borderTop: `1px solid ${T.line}`, fontSize: 14, lineHeight: 1.7, color: T.ink2 }}>
                {Array.isArray(cur.fullDefinition) && cur.fullDefinition.length > 0 && (
                                  <div className="mb-3">
                                                        <Label style={{ marginBottom: 4 }}>Full meaning</Label>
                                                        <FullDef item={cur} fallback="" />
                                  </div>
                                )}
                {cur.example && (
                  <div className="mb-3">
                    <Label style={{ marginBottom: 4 }}>Example</Label>
                    <span>“{cur.example}”</span>
                    <span className="ml-2 inline-block align-middle">
                      <Speaker text={cur.example} size={13} />
                    </span>
                  </div>
                )}
                {cur.context && (
                  <div>
                    <Label style={{ marginBottom: 4 }}>Where you found it</Label>
                    {cur.context
                      .split(new RegExp(`(${cur.word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "i"))
                      .map((p, i) =>
                        p.toLowerCase() === cur.word.toLowerCase() ? (
                          <mark key={i} style={{ background: T.marker, color: T.ink, padding: "0 2px" }}>
                            {p}
                          </mark>
                        ) : (
                          <span key={i}>{p}</span>
                        )
                      )}
                  </div>
                )}
              </div>
            )}
          </>
        )}
      </div>

      <div className="mt-3 flex justify-between gap-3">
        <span style={{ fontFamily: MONO, fontSize: 10, color: T.ink3 }}>
          1–4 answer · enter next · p play
        </span>
        <button onClick={goDeck} style={{ fontFamily: MONO, fontSize: 11, color: T.ink2 }}>
          open deck →
        </button>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  DECK                                                               */
/* ------------------------------------------------------------------ */
function DeckView({ words, learning, mastered, update, remove, setWords, addWords, lang, setLang, retryLookup, busy }) {
  const [tab, setTab] = useState("learning");
  const [filter, setFilter] = useState("all");
  const [editId, setEditId] = useState(null);
  const [manual, setManual] = useState("");
  const fileRef = useRef(null);

  const base = tab === "learning" ? learning : mastered;
  const list = base.filter((w) => (filter === "all" ? true : filter === "phrase" ? w.kind === "phrase" : w.kind !== "phrase"));
  const sorted = [...list].sort((a, b) => b.added - a.added);

  const exportJSON = () => {
    const blob = new Blob([JSON.stringify(words, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `wordpile-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const importJSON = (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const inc = JSON.parse(r.result);
        if (!Array.isArray(inc)) return;
        setWords((cur) => {
          const have = new Set(cur.map((w) => w.word.toLowerCase()));
          return [...cur, ...inc.filter((w) => w.word && !have.has(w.word.toLowerCase()))];
        });
      } catch {}
    };
    r.readAsText(f);
    e.target.value = "";
  };

  const addManual = () => {
    if (!manual.trim()) return;
    addWords(
      manual
        .split(/[,\n]/)
        .map((s) => s.trim())
        .filter(Boolean)
        .map((w) => ({ word: w, context: "" }))
    );
    setManual("");
  };

  const missing = words.filter((w) => !w.definition).length;

  return (
    <div>
      {missing > 0 && (
        <div
          className="mb-4 px-4 py-3 rounded-lg flex flex-wrap items-center justify-between gap-3"
          style={{ background: T.card, border: `1px solid ${T.bad}` }}
        >
          <span style={{ fontSize: 14, color: T.ink2 }}>
            {missing} card{missing > 1 ? "s have" : " has"} no meaning yet, so {missing > 1 ? "they stay" : "it stays"} out of the drill.
          </span>
          <button
            onClick={retryLookup}
            disabled={busy}
            className="px-4 py-2 rounded-full"
            style={{ background: busy ? T.line : T.ink, color: busy ? T.ink3 : T.card, fontFamily: MONO, fontSize: 11 }}
          >
            {busy ? "fetching…" : "fetch meanings"}
          </button>
        </div>
      )}
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <Seg
          value={tab}
          onChange={setTab}
          items={[
            { id: "learning", label: "Learning", count: learning.length },
            { id: "mastered", label: "Known", count: mastered.length },
          ]}
        />
        <div className="flex items-center gap-3">
          <select
            value={lang}
            onChange={(e) => setLang(e.target.value)}
            className="vd-in px-2 py-1.5"
            style={{ fontFamily: MONO, fontSize: 11, color: T.ink2 }}
            title="Language used for new cards"
          >
            <option value="en">EN meanings</option>
            <option value="ja">JA 日本語</option>
            <option value="both">EN + JA</option>
          </select>
          <button onClick={exportJSON} style={{ fontFamily: MONO, fontSize: 11, color: T.ink2 }}>
            back up
          </button>
          <button onClick={() => fileRef.current?.click()} style={{ fontFamily: MONO, fontSize: 11, color: T.ink2 }}>
            restore
          </button>
          <input ref={fileRef} type="file" accept="application/json" onChange={importJSON} className="hidden" />
        </div>
      </div>

      <div className="flex gap-4 mb-4">
        {["all", "word", "phrase"].map((f) => (
          <button
            key={f}
            onClick={() => setFilter(f)}
            style={{
              fontFamily: MONO,
              fontSize: 11,
              letterSpacing: "0.1em",
              textTransform: "uppercase",
              color: filter === f ? T.ink : T.ink3,
              borderBottom: filter === f ? `2px solid ${T.marker}` : "2px solid transparent",
              paddingBottom: 2,
            }}
          >
            {f === "all" ? "everything" : f === "word" ? "single words" : "phrases"}
          </button>
        ))}
      </div>

      <div className="flex gap-2 mb-5">
        <input
          value={manual}
          onChange={(e) => setManual(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && addManual()}
          placeholder="Add a word or phrase by hand — comma-separate for several"
          className="vd-in flex-1 px-3 py-2"
          style={{ fontSize: 14, color: T.ink }}
        />
        <button
          onClick={addManual}
          className="px-4 rounded-lg"
          style={{ background: T.ink, color: T.card, fontFamily: MONO, fontSize: 12 }}
        >
          add
        </button>
      </div>

      {!sorted.length && (
        <div className="p-8 rounded-lg text-center" style={{ background: T.card, border: `1px solid ${T.line}`, color: T.ink2 }}>
          {tab === "learning" ? "Nothing in rotation yet." : "A card lands here after three correct answers."}
        </div>
      )}

      <div className="space-y-2">
        {sorted.map((w) => {
          const editing = editId === w.id;
          return (
            <div key={w.id} className="rounded-lg" style={{ background: T.card, border: `1px solid ${T.line}` }}>
              <div className="px-4 py-3 flex items-start gap-4">
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span style={{ fontFamily: MONO, fontSize: 16 }}>{w.word}</span>
                    <Speaker text={w.word} />
                    <Speaker text={w.word} slow />
                    {w.kind === "phrase" && (
                      <span style={{ fontFamily: MONO, fontSize: 9, color: T.ink3, letterSpacing: "0.1em" }}>PHRASE</span>
                    )}
                    {w.pos && <span style={{ fontSize: 12, color: T.ink3, fontStyle: "italic" }}>{w.pos}</span>}
                  </div>
                  <div style={{ fontSize: 14, color: w.definition ? T.ink2 : T.bad, marginTop: 3 }}>
                    {w.definition ? <FullDef item={w} fallback="No meaning yet — edit to add one" /> : "No meaning yet — edit to add one"}
                  </div>
                  {w.example && (
                    <div style={{ fontSize: 13, color: T.ink3, marginTop: 4, lineHeight: 1.6 }}>“{w.example}”</div>
                  )}
                </div>
                <div className="flex flex-col items-end gap-2 shrink-0">
                  <Tally n={w.streak} />
                  <div style={{ fontFamily: MONO, fontSize: 10, color: T.ink3 }}>
                    {w.right}✓ {w.wrong}✗
                  </div>
                  {(w.saidRight || w.saidWrong) > 0 && (
                    <div style={{ fontFamily: MONO, fontSize: 10, color: T.ink3 }}>
                      say {w.saidRight || 0}/{(w.saidRight || 0) + (w.saidWrong || 0)}
                    </div>
                  )}
                </div>
              </div>

              <div className="px-4 py-2 flex flex-wrap gap-4" style={{ borderTop: `1px solid ${T.line}` }}>
                <button onClick={() => setEditId(editing ? null : w.id)} style={{ fontFamily: MONO, fontSize: 11, color: T.ink2 }}>
                  {editing ? "close" : "edit"}
                </button>
                {w.streak > 0 && (
                  <button onClick={() => update(w.id, { streak: 0 })} style={{ fontFamily: MONO, fontSize: 11, color: T.ink2 }}>
                    {w.streak >= NEEDED ? "put back in rotation" : "reset tallies"}
                  </button>
                )}
                <button onClick={() => remove(w.id)} style={{ fontFamily: MONO, fontSize: 11, color: T.bad }}>
                  delete
                </button>
              </div>

              {editing && (
                <div className="px-4 py-4 space-y-2" style={{ borderTop: `1px solid ${T.line}` }}>
                  <Label>Say it back</Label>
                  <SayIt
                    compact
                    target={w.word}
                    onResult={(ok) =>
                      update(w.id, ok ? { saidRight: (w.saidRight || 0) + 1 } : { saidWrong: (w.saidWrong || 0) + 1 })
                    }
                  />
                  <Label style={{ paddingTop: 8 }}>Correct meaning</Label>
                  <input
                    value={w.definition}
                    onChange={(e) => update(w.id, { definition: e.target.value })}
                    className="vd-in w-full px-3 py-2"
                    style={{ fontSize: 14, color: T.ink }}
                  />
                  <Label style={{ paddingTop: 6 }}>Example sentence</Label>
                  <input
                    value={w.example || ""}
                    onChange={(e) => update(w.id, { example: e.target.value })}
                    className="vd-in w-full px-3 py-2"
                    style={{ fontSize: 14, color: T.ink2 }}
                  />
                  <Label style={{ paddingTop: 6 }}>Wrong options</Label>
                  {[0, 1, 2].map((i) => (
                    <input
                      key={i}
                      value={w.distractors?.[i] || ""}
                      onChange={(e) => {
                        const d = [...(w.distractors || ["", "", ""])];
                        d[i] = e.target.value;
                        update(w.id, { distractors: d });
                      }}
                      className="vd-in w-full px-3 py-2"
                      style={{ fontSize: 14, color: T.ink2 }}
                    />
                  ))}
                  {w.context && (
                    <>
                      <Label style={{ paddingTop: 6 }}>Where you found it</Label>
                      <div style={{ fontSize: 13, color: T.ink2, lineHeight: 1.6 }}>{w.context}</div>
                    </>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

const rootEl = document.getElementById('root');
const root = ReactDOM.createRoot(rootEl);
root.render(<VocabDrill />);
</script>
</body>
</html>
